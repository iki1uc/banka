<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◈ KODEX · iki1uc · ruleset · runtime</title>
<style>
  :root{--bg:#04070e;--bg2:#0a101e;--bg3:#101828;--fg:#c8d8e8;--dim:#5a7288;--dim2:#2a3644;
    --green:#7ce0a8;--cyan:#5fc8ff;--gold:#ffcc44;--violet:#b388ff;--pink:#ff88b0;--red:#ff5a7a;
    --line:rgba(140,180,220,0.09);--line2:rgba(140,180,220,0.04)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:var(--fg);font-family:'Consolas',monospace;font-size:12px;overflow:hidden;height:100vh}
  #desk{width:100vw;height:100vh;background:var(--bg);display:flex;flex-direction:column}
  #topbar{height:34px;background:linear-gradient(180deg,#0a101e,#04070e);
    border-bottom:1px solid var(--line);display:flex;align-items:center;
    padding:0 14px;font-size:11px;letter-spacing:1px;gap:12px;flex-shrink:0}
  #topbar .logo{color:var(--gold);font-weight:bold;letter-spacing:3px;text-shadow:0 0 10px var(--gold)}
  #topbar .logo b{color:var(--violet)}
  #topbar .sep{width:1px;height:16px;background:var(--line)}
  #topbar .path{color:var(--dim);font-size:10px}
  #topbar .stat{color:var(--dim);font-size:10px;display:flex;gap:12px;margin-left:auto}
  #topbar .stat b{color:var(--gold)}
  #main{flex:1;display:grid;grid-template-columns:220px 1fr;overflow:hidden;min-height:0}
  #nav{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:8px 0}
  #nav::-webkit-scrollbar{width:5px}#nav::-webkit-scrollbar-thumb{background:var(--line)}
  .hdr{padding:8px 12px 4px;color:var(--dim);font-size:9px;letter-spacing:2px;text-transform:uppercase;
    border-bottom:1px solid var(--line2);margin-bottom:4px}
  .node{padding:5px 12px 5px 22px;color:var(--fg);cursor:pointer;display:flex;
    justify-content:space-between;font-size:10.5px;border-left:2px solid transparent;transition:.15s;position:relative}
  .node::before{content:'▸';position:absolute;left:8px;color:var(--dim2);font-size:9px}
  .node:hover{background:rgba(255,204,68,0.06);border-left-color:var(--gold)}
  .node.active{background:rgba(255,204,68,0.1);border-left-color:var(--gold);color:var(--gold)}
  #content{overflow-y:auto;padding:20px 28px;min-height:0;font-size:13px;line-height:1.8}
  #content::-webkit-scrollbar{width:6px}#content::-webkit-scrollbar-thumb{background:var(--line)}
  .art{max-width:820px;margin:0 auto}
  .art h1{font-size:22px;letter-spacing:4px;color:var(--gold);margin-bottom:6px;
    text-transform:uppercase;text-shadow:0 0 12px rgba(255,204,68,0.4)}
  .art .sub{color:var(--dim);font-size:11px;letter-spacing:3px;margin-bottom:24px;text-transform:uppercase}
  .art h2{font-size:14px;letter-spacing:2px;color:var(--cyan);margin:24px 0 10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);text-transform:uppercase}
  .art p{margin-bottom:12px;color:var(--fg)}
  .art .lead{font-size:14px;color:var(--violet);font-style:italic;line-height:1.9;
    padding:12px 16px;border-left:3px solid var(--violet);background:rgba(179,136,255,0.05);margin-bottom:20px}
  .art .rule{padding:10px 14px;background:var(--bg2);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:4px;margin-bottom:10px}
  .art .rule .n{font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:bold}
  .art .rule .t{color:var(--fg);margin-top:4px}
  .art .axiom{display:inline-block;padding:3px 10px;border:1px solid var(--gold);
    color:var(--gold);border-radius:3px;font-size:11px;letter-spacing:2px;margin:2px}
  .art code{background:var(--bg3);padding:2px 6px;border-radius:3px;color:var(--pink);
    font-size:12px;border:1px solid var(--line)}
  .art table{width:100%;border-collapse:collapse;margin:14px 0}
  .art th,.art td{padding:8px 10px;border:1px solid var(--line);text-align:left;font-size:12px}
  .art th{background:var(--bg3);color:var(--cyan);letter-spacing:1px;font-weight:normal;text-transform:uppercase;font-size:10px}
  .art .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .art .card{padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:6px}
  .art .card .h{font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
  .art .card .b{color:var(--fg);font-size:12px;line-height:1.6}
  #cli{height:32px;background:#02040a;border-top:1px solid var(--line);
    display:flex;align-items:center;padding:0 12px;font-size:11px;flex-shrink:0}
  #cli .prompt{color:var(--gold);margin-right:6px;font-weight:bold}
  #cli input{flex:1;background:transparent;border:none;color:var(--fg);font-family:inherit;font-size:11px;outline:none}
  #cli input::placeholder{color:var(--dim2)}
</style>
</head>
<body>
<div id="desk">
  <div id="topbar">
    <span class="logo">◈ KODEX<b>::iki1uc</b></span>
    <span class="sep"></span>
    <span class="path">/kodex > ruleset · axiom · law</span>
    <div class="stat">
      <span>ARTICLES <b id="tArt">0</b></span>
      <span>RULES <b id="tRules">0</b></span>
      <span>STATE <b id="tState">loaded</b></span>
    </div>
  </div>
  <div id="main">
    <div id="nav"></div>
    <div id="content">
      <div class="art" id="art"></div>
    </div>
  </div>
  <div id="cli">
    <span class="prompt">kodex&gt;</span>
    <input id="cmdInput" placeholder="command: art 1 · art 2 · art 3 · rule · axiom · help" autocomplete="off">
  </div>
</div>
<script>
"use strict";
const KODEX = {
  title: 'iki1uc · kodex',
  subtitle: 'ruleset · axiom · law · runtime',
  articles: [
    {
      id: 'intro', title: 'Introduction',
      html: `
        <h1>iki1uc · Kodex</h1>
        <div class="sub">ruleset · axiom · law</div>
        <div class="lead">Not magic. Pure mathematics. 64 below + 64 above = 128. Always only forward.</div>
        <p>This codex defines the rules under which the system <b>iki1uc</b> operates. It is not a manual for the user. It is the law for the runtime.</p>
        <h2>Purpose</h2>
        <p>The system builds a real value state out of work, time and logic. It runs from RAM. It does not write. It does not confuse. It only sets forward.</p>
        <h2>Foundation</h2>
        <p><span class="axiom">3 → 9 → 81 → 3</span></p>
        <p>Every process begins at 3. It grows to 9. It becomes 81. Then it returns to 3 — but new. This is the natural cycle. It is the law.</p>
      `
    },
    {
      id: 'rule1', title: 'Article I · Always Forward',
      html: `
        <h1>Article I</h1>
        <div class="sub">Always only forward</div>
        <div class="rule"><div class="n">RULE I.1</div><div class="t">The system only runs forward. There is no rewind. There is only the next step.</div></div>
        <div class="rule"><div class="n">RULE I.2</div><div class="t">Memory is always of equal size: yes/no · 1/0. Nothing accumulates.</div></div>
        <div class="rule"><div class="n">RULE I.3</div><div class="t">64 steps are run in sequence. Every second one is skipped.</div></div>
        <h2>Why</h2>
        <p>Rewind creates drift. Drift costs energy. Energy loss breaks the cycle. Forward motion is the only stable state.</p>
        <h2>Exception</h2>
        <p>If skipping is not needed, the skip may be removed — a change as desired. The total remains 128.</p>
      `
    },
    {
      id: 'rule2', title: 'Article II · The Six Positions',
      html: `
        <h1>Article II</h1>
        <div class="sub">Six positions · one surface</div>
        <div class="rule"><div class="n">POSITION 1 · MAIN 42</div><div class="t">Diagonal D-O-W. The primary axis.</div></div>
        <div class="rule"><div class="n">POSITION 2 · SIDE 43</div><div class="t">Diagonal I-O-S. The secondary axis.</div></div>
        <div class="rule"><div class="n">POSITION 3 · CORNERS 55</div><div class="t">D, I, S, W. The four outer points.</div></div>
        <div class="rule"><div class="n">POSITION 4 · SPIRAL 128</div><div class="t">Around. The full cycle.</div></div>
        <div class="rule"><div class="n">POSITION 5 · COLUMNS</div><div class="t">Vertical. The upright axes.</div></div>
        <div class="rule"><div class="n">POSITION 6 · CENTRE 15</div><div class="t">Crystal. The still middle.</div></div>
      `
    },
    {
      id: 'rule3', title: 'Article III · Behaviour Measure',
      html: `
        <h1>Article III</h1>
        <div class="sub">Behaviour · measure · value</div>
        <div class="rule"><div class="n">RULE III.1</div><div class="t">Every node carries a behaviour value between 0 and 4.</div></div>
        <div class="rule"><div class="n">RULE III.2</div><div class="t">3-clusters carry 3 nodes. 9-rings aggregate 3 clusters. 81 matrix fills from the rings.</div></div>
        <div class="rule"><div class="n">RULE III.3</div><div class="t">The final work value is: <code>value = avg3·0.25 + avg9·0.35 + avg81·0.40</code></div></div>
        <h2>Behaviour levels</h2>
        <table>
          <tr><th>Value</th><th>State</th><th>Meaning</th></tr>
          <tr><td>0</td><td>calm</td><td>not yet started</td></tr>
          <tr><td>1</td><td>alert</td><td>watching</td></tr>
          <tr><td>2</td><td>active</td><td>working</td></tr>
          <tr><td>3</td><td>intense</td><td>maximum effort</td></tr>
          <tr><td>4</td><td>done</td><td>completed</td></tr>
        </table>
      `
    },
    {
      id: 'rule4', title: 'Article IV · Language Runtime',
      html: `
        <h1>Article IV</h1>
        <div class="sub">Language · runtime · workaround</div>
        <div class="rule"><div class="n">RULE IV.1</div><div class="t">The system speaks four languages: DE, TR, EN-GB, and the codex itself.</div></div>
        <div class="rule"><div class="n">RULE IV.2</div><div class="t">Every language version is a full runtime — not a translation, not a summary.</div></div>
        <div class="rule"><div class="n">RULE IV.3</div><div class="t">The index.html is the runtime shell. It loads de.html, tr.html, en.html, or kodex.html. One entry point. Four faces.</div></div>
        <h2>Workaround</h2>
        <p>If one language fails, another is loaded. This is the workaround. The runtime never stops because a language is missing. It switches, then continues.</p>
      `
    },
    {
      id: 'rule5', title: 'Article V · Bank · 80/20',
      html: `
        <h1>Article V</h1>
        <div class="sub">Deposit · draw · capital</div>
        <div class="rule"><div class="n">RULE V.1</div><div class="t">Every deposit is split: 80% goes to the bank at once. 20% remains as the depositor's own stake.</div></div>
        <div class="rule"><div class="n">RULE V.2</div><div class="t">The 20% stake is valued at buy/sell. Multipliers from work and time apply only to this stake.</div></div>
        <div class="rule"><div class="n">RULE V.3</div><div class="t">The bank holds 50.001% of the system. Capitalisation is only possible through the bank.</div></div>
        <h2>Formula</h2>
        <p><code>end = (deposit · 0.2) · multipliers + (deposit · 0.8)</code></p>
        <h2>Why 80/20</h2>
        <p>The bank never loses, because the 80% is not returned. The depositor has a stake that grows over time — a real value, tied to the firm.</p>
      `
    },
    {
      id: 'rule6', title: 'Article VI · The Runtime',
      html: `
        <h1>Article VI</h1>
        <div class="sub">index.html · run · runtime</div>
        <div class="rule"><div class="n">RULE VI.1</div><div class="t">index.html is the runtime. It does not display content. It launches a run.</div></div>
        <div class="rule"><div class="n">RULE VI.2</div><div class="t">The runtime checks: which language files exist, which are missing, which can be loaded.</div></div>
        <div class="rule"><div class="n">RULE VI.3</div><div class="t">If a file is missing, the runtime switches to a fallback. The run continues.</div></div>
        <h2>State machine</h2>
        <p><code>index.html → [de · tr · en · kodex] → active layer → 3→9→81→3</code></p>
        <h2>Never stops</h2>
        <p>The runtime never stops because a file is missing. This is the workaround. This is the rule.</p>
      `
    },
    {
      id: 'closing', title: 'Closing',
      html: `
        <h1>Closing</h1>
        <div class="sub">not magic · pure mathematics</div>
        <div class="lead">"I have uplift. Have you had enough of falling?"</div>
        <h2>Final rule</h2>
        <div class="rule"><div class="n">FINAL</div><div class="t">If the system does not run, it is a gift. It was intended so.</div></div>
        <h2>Signature</h2>
        <p>iki1uc · 90 60 90 fulfilment · all-round<br>onemanarmy · always only forward</p>
      `
    }
  ]
};

const nav = document.getElementById('nav');
const art = document.getElementById('art');
function renderNav() {
  nav.innerHTML = '<div class="hdr">▸ kodex · articles</div>';
  KODEX.articles.forEach(a => {
    const d = document.createElement('div');
    d.className = 'node';
    d.dataset.id = a.id;
    d.innerHTML = `<span>${a.title}</span><span style="color:var(--dim2);font-size:9px">§</span>`;
    d.addEventListener('click', () => showArticle(a.id));
    nav.appendChild(d);
  });
  document.getElementById('tArt').textContent = KODEX.articles.length;
}
function showArticle(id) {
  const a = KODEX.articles.find(x => x.id === id) || KODEX.articles[0];
  art.innerHTML = a.html;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  document.getElementById('content').scrollTop = 0;
}
function handleCmd(cmd) {
  const c = cmd.trim().toLowerCase();
  if (!c) return;
  if (c === 'help') console.log('art 1 · art 2 · ... · rule · axiom · list');
  else if (c === 'list') console.log(KODEX.articles.map(a => a.id).join(' · '));
  else if (c === 'rule') showArticle('rule1');
  else if (c === 'axiom') showArticle('intro');
  else if (c.startsWith('art ')) {
    const n = parseInt(c.slice(4), 10);
    const target = KODEX.articles[n] || KODEX.articles[0];
    if (target) showArticle(target.id);
  }
}
document.getElementById('cmdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { handleCmd(e.target.value); e.target.value = ''; }
});
renderNav();
showArticle('intro');
window.KODEX = KODEX;
</script>
</body>
</html>
