<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◈ ENERGIE · 21 · 21 · 42 · 6 elemente</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;color:#c8d8e8;
    font-family:'Consolas',monospace;overflow:hidden}
  body{display:grid;grid-template-rows:34px 1fr 26px}

  #top{background:#0a101e;border-bottom:1px solid #1a2a3a;
    display:flex;align-items:center;padding:0 14px;
    font-size:11px;letter-spacing:2px;gap:14px}
  #top b{color:#f0d080}
  #top .right{margin-left:auto;display:flex;gap:14px;
    font-size:10px;color:#5a7288}

  #main{position:relative;overflow:hidden}
  #c{display:block;width:100%;height:100%}

  /* Frage / Antwort overlay */
  #qa{
    position:absolute;bottom:30px;left:50%;
    transform:translateX(-50%);
    text-align:center;pointer-events:none;
    min-width:320px;max-width:80%;
    opacity:0;transition:opacity .35s
  }
  #qa.on{opacity:1}
  #qa .frage{
    font-size:11px;letter-spacing:3px;color:#5a7288;
    text-transform:uppercase;margin-bottom:6px
  }
  #qa .antwort{
    font-size:18px;letter-spacing:2px;color:#f0d080;
    text-shadow:0 0 14px rgba(240,208,128,.5)
  }
  #qa .element{
    font-size:10px;letter-spacing:2px;color:#5cf0ff;
    margin-top:6px;text-transform:uppercase
  }

  /* Zahlen oben */
  #zahlen{
    position:absolute;top:14px;left:50%;
    transform:translateX(-50%);
    display:flex;gap:24px;font-size:11px;
    letter-spacing:2px;color:#5a7288;
    pointer-events:none
  }
  #zahlen span b{color:#f0d080}
  #zahlen span.half b{color:#b388ff}
  #zahlen span.full b{color:#f0d080}

  #bottom{background:#0c1828;border-top:1px solid #1a2a3a;
    display:flex;align-items:center;padding:0 14px;
    font-size:10px;color:#5a7288;letter-spacing:1px;gap:14px}
  #bottom b{color:#f0d080}
  #bottom .hint{margin-left:auto;color:#5cf0ff}
</style>
</head>
<body>

<div id="top">
  <span>◈ <b>ENERGIE</b> · 21 · 21 · 42</span>
  <span class="right">
    <span>HALB <b id="tHalb">21</b></span>
    <span>VOLL <b id="tVoll">42</b></span>
    <span>WURZEL <b id="tWurzel">√42</b></span>
  </span>
</div>

<div id="main">
  <canvas id="c"></canvas>

  <div id="zahlen">
    <span class="half">HALB <b>21</b></span>
    <span class="full">VOLL <b>42</b></span>
    <span>21 × 2 = <b>42</b></span>
  </div>

  <div id="qa">
    <div class="frage" id="qaFrage">— klick ein element —</div>
    <div class="antwort" id="qaAntwort">—</div>
    <div class="element" id="qaElement">—</div>
  </div>
</div>

<div id="bottom">
  <span>◈ 1ns · Wasser · Mana · Aura · Zen · Icefeuer · Glauben</span>
  <span>Frage und Antwort · kohärent</span>
  <span class="hint">element anklicken</span>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════
   ENERGIE · 21 · 21 · 42 · 6 elemente
   ═══════════════════════════════════════════════════════ */

/* ─── die 6 Elemente mit Frage + Antwort ──────────────── */
const ELEMENTE = [
  { name:"WASSER",   frage:"Was ist?",        antwort:"Wasser ist.",     color:"#5fc8ff" },
  { name:"MANA",     frage:"Was gibt?",       antwort:"Mana gibt.",      color:"#ff66c8" },
  { name:"AURA",     frage:"Was scheint?",    antwort:"Aura scheint.",   color:"#f0d080" },
  { name:"ZEN",      frage:"Was hält?",       antwort:"Zen hält.",       color:"#8cf0d0" },
  { name:"ICEFEUER", frage:"Was kann?",       antwort:"Icefeuer kann.",  color:"#b388ff" },
  { name:"GLAUBEN",  frage:"Was sieht?",      antwort:"Glauben sieht.",  color:"#ff8a2a" }
];

/* ─── Zustand ─────────────────────────────────────────── */
const S = {
  tick: 0,
  breath: 0,
  active: -1,       // welches Element grad geklickt wurde
  hover: -1,
  cursor: { x: 0, y: 0 }
};

/* ─── Canvas Setup ────────────────────────────────────── */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W, H, cx, cy, R;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  R = Math.min(W, H) * 0.34;
}
resize();
window.addEventListener("resize", resize);

/* ─── Positionen der 6 Elemente ──────────────────────── */
function elementPos(i, t) {
  const angle = (i / 6) * Math.PI * 2 - Math.PI / 2 + t * 0.0004;
  const r = R * 1.15 + Math.sin(t * 0.001 + i * 1.1) * 6;
  return {
    x: cx + Math.cos(angle) * r,
    y: cy + Math.sin(angle) * r,
    angle: angle
  };
}

/* ─── Klick-Prüfung ──────────────────────────────────── */
function hitTest(mx, my, t) {
  for (let i = 0; i < 6; i++) {
    const p = elementPos(i, t);
    const d = Math.hypot(mx - p.x, my - p.y);
    if (d < 24) return i;
  }
  return -1;
}

cv.addEventListener("mousemove", (e) => {
  const r = cv.getBoundingClientRect();
  S.cursor.x = e.clientX - r.left;
  S.cursor.y = e.clientY - r.top;
  S.hover = hitTest(S.cursor.x, S.cursor.y, S.tick);
  cv.style.cursor = S.hover >= 0 ? "pointer" : "default";
});

cv.addEventListener("click", () => {
  if (S.hover >= 0) {
    S.active = S.active === S.hover ? -1 : S.hover;
    updateQA();
  }
});

function updateQA() {
  const el = document.getElementById("qa");
  if (S.active < 0) {
    el.classList.remove("on");
    return;
  }
  const e = ELEMENTE[S.active];
  document.getElementById("qaFrage").textContent = e.frage;
  document.getElementById("qaAntwort").textContent = e.antwort;
  document.getElementById("qaElement").textContent = "· " + e.name + " ·";
  el.classList.add("on");
}

/* ─── Zeichnen ────────────────────────────────────────── */
function draw() {
  const t = S.tick;

  // sanfter Schleier
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.fillRect(0, 0, W, H);

  // Atem · 1.5 Hz · 42/21 Rhythmus
  S.breath = 0.5 + Math.sin(t * 0.03) * 0.5;

  /* ─── der volle Raum 42 ────────────────────────── */
  const breathR = R * (0.95 + S.breath * 0.05);

  // drei Ringe (der Schöpfraum)
  [
    { r: breathR,      color:"#f0d080", a:0.15 },
    { r: breathR*0.75, color:"#b388ff", a:0.10 },
    { r: breathR*0.5,  color:"#5cf0ff", a:0.08 }
  ].forEach(ring => {
    ctx.strokeStyle = ring.color + Math.round(ring.a * 255).toString(16).padStart(2,"0");
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
    ctx.stroke();
  });

  /* ─── die zwei 21er · geben und nehmen ──────────── */
  // Hälfte 1: Geben (untere Hälfte des Kreises)
  // Hälfte 2: Nehmen (obere Hälfte)
  const halfR = breathR * 0.85;

  // Geben
  ctx.strokeStyle = "rgba(255,102,200,0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, halfR, 0, Math.PI);
  ctx.stroke();

  // Nehmen
  ctx.strokeStyle = "rgba(92,240,255,0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, halfR, Math.PI, Math.PI * 2);
  ctx.stroke();

  // Labels für die zwei 21er
  ctx.font = "bold 13px Consolas";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,102,200,0.7)";
  ctx.fillText("21 · GEBEN",  cx, cy + halfR * 0.55);
  ctx.fillStyle = "rgba(92,240,255,0.7)";
  ctx.fillText("21 · NEHMEN", cx, cy - halfR * 0.55);

  /* ─── Mitte: 42 ────────────────────────────────── */
  const pulse = 0.6 + Math.sin(t * 0.05) * 0.4;

  // Glow
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60 + pulse * 20);
  grad.addColorStop(0, `rgba(240,208,128,${0.5 + pulse * 0.4})`);
  grad.addColorStop(0.5, `rgba(240,208,128,${0.15 + pulse * 0.1})`);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 60 + pulse * 20, 0, Math.PI * 2);
  ctx.fill();

  // die 42
  ctx.font = "bold 40px Consolas";
  ctx.fillStyle = `rgba(255,255,255,${0.85 + pulse * 0.15})`;
  ctx.shadowColor = "#f0d080";
  ctx.shadowBlur = 25 * pulse;
  ctx.fillText("42", cx, cy + 2);
  ctx.shadowBlur = 0;

  // Bezeichnung
  ctx.font = "9px Consolas";
  ctx.fillStyle = "rgba(240,208,128,0.6)";
  ctx.fillText("VOLLER SCHÖPFRAUM", cx, cy + 30);

  /* ─── 6 Elemente am Rand ───────────────────────── */
  for (let i = 0; i < 6; i++) {
    const p = elementPos(i, t);
    const e = ELEMENTE[i];
    const isActive = i === S.active;
    const isHover = i === S.hover;

    // Verbindungslinie zum Zentrum
    ctx.strokeStyle = e.color + "22";
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    // Puls
    const ph = t * 0.04 + i * 1.2;
    const localPulse = 0.6 + Math.sin(ph) * 0.4;

    // Größe
    const baseSize = isActive ? 22 : isHover ? 18 : 14;
    const size = baseSize + localPulse * 2;

    // Glow
    ctx.shadowColor = e.color;
    ctx.shadowBlur = (isActive ? 30 : isHover ? 20 : 10) * localPulse;

    // Kreis
    ctx.fillStyle = isActive ? e.color : e.color + "88";
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();

    // Ring
    ctx.strokeStyle = e.color;
    ctx.lineWidth = isActive ? 2 : 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size + 4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 0;

    // Name unter dem Kreis
    ctx.font = isActive ? "bold 10px Consolas" : "9px Consolas";
    ctx.fillStyle = isActive ? "#fff" : e.color;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(e.name, p.x, p.y + size + 8);
  }

  /* ─── Wurzel-Anzeige ───────────────────────────── */
  // √42 = 6.48... lebt als sanfte Welle
  ctx.font = "9px Consolas";
  ctx.fillStyle = "rgba(140,180,220,0.4)";
  ctx.textAlign = "left";
  ctx.textBaseline = "bottom";
  ctx.fillText("√42 = 6.480…", 14, H - 14);

  ctx.textAlign = "right";
  ctx.fillText("21 × 2 = 42", W - 14, H - 14);

  S.tick++;
  requestAnimationFrame(draw);
}

/* ─── Init ────────────────────────────────────────────── */
draw();

/* Public API */
window.ENERGIE = {
  elements: () => ELEMENTE,
  setActive: (i) => { S.active = i; updateQA(); },
  state: () => ({ tick: S.tick, active: S.active, breath: S.breath })
};
</script>
</body>
</html>
