<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◈ TR GÜCÜ · 5 dk bench · iki1uc</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;color:#c8d8e8;
    font-family:'Consolas',monospace;overflow:hidden}
  body{display:grid;grid-template-rows:44px 1fr 32px}
  #top{background:#0a101e;border-bottom:1px solid #1a2a3a;
    display:flex;align-items:center;padding:0 16px;gap:14px;
    font-size:11px;letter-spacing:2px}
  #top b{color:#f0d080}
  #top .right{margin-left:auto;display:flex;gap:14px;font-size:10px;color:#5a7288}
  #main{display:grid;grid-template-columns:1fr 1fr;
    gap:1px;background:#000;overflow:hidden;min-height:0}
  .col{background:#0a0a12;display:flex;flex-direction:column;overflow:hidden}
  .col h2{background:#0c1828;color:#5cf0ff;font-size:11px;
    padding:6px 12px;letter-spacing:2px;font-weight:normal;
    border-bottom:1px solid #1a2a3a;display:flex;justify-content:space-between}
  .col h2 b{color:#f0d080}
  .body{flex:1;overflow:auto;padding:14px;font-size:12px}
  .body::-webkit-scrollbar{width:6px}
  .body::-webkit-scrollbar-thumb{background:#1a2a3a}

  /* Slider */
  .zeitwahl{display:flex;gap:4px;margin-bottom:10px}
  .zeitwahl button{flex:1;padding:6px;background:#0c1828;
    color:#5a7288;border:1px solid #1a2a3a;border-radius:3px;
    font-family:inherit;font-size:11px;cursor:pointer;
    letter-spacing:1px;transition:.15s}
  .zeitwahl button:hover{border-color:#5cf0ff;color:#5cf0ff}
  .zeitwahl button.on{background:#1a3a4a;border-color:#0f0;color:#0f0}

  /* Zahlen */
  .zahlen{display:grid;grid-template-columns:repeat(3,1fr);
    gap:8px;margin-bottom:12px}
  .z{background:#0c1828;border:1px solid #1a2a3a;border-radius:4px;
    padding:10px;text-align:center}
  .z .k{font-size:9px;color:#5a7288;letter-spacing:1.5px;
    text-transform:uppercase}
  .z .v{font-size:22px;font-weight:bold;color:#f0d080;margin-top:4px;
    text-shadow:0 0 10px rgba(240,208,128,.5)}
  .z.cpu .v{color:#ff8a2a}
  .z.gpu .v{color:#ff3ea5}
  .z.ram .v{color:#39ff88}

  /* Balken */
  .bar{height:6px;background:#0a1420;border-radius:2px;
    overflow:hidden;margin:4px 0 10px}
  .bar i{display:block;height:100%;transition:width .3s}

  /* Canvas */
  #c{display:block;width:100%;height:100%;background:#000}

  /* Start */
  .start{background:#1a3a2a;border:1px solid #39ff88;color:#39ff88;
    padding:14px;width:100%;font-family:inherit;font-size:14px;
    letter-spacing:3px;cursor:pointer;border-radius:4px;
    text-transform:uppercase;font-weight:bold}
  .start:hover{background:#0f4a2a;box-shadow:0 0 20px rgba(57,255,136,.4)}
  .start:disabled{opacity:.4;cursor:not-allowed}

  /* Log */
  #log{margin-top:10px;padding:8px;background:#000;
    border:1px solid #1a2a3a;border-radius:3px;
    font-size:10px;line-height:1.6;color:#5a7288;
    height:100px;overflow:auto}
  #log div{padding:1px 0}
  #log .ok{color:#39ff88}
  #log .warn{color:#f0d080}

  /* Bottom */
  #bottom{background:#0c1828;border-top:1px solid #1a2a3a;
    display:flex;align-items:center;padding:0 16px;
    font-size:10px;color:#5a7288;letter-spacing:1px;gap:14px}
  #bottom b{color:#f0d080}
</style>
</head>
<body>

<div id="top">
  <span>◈ <b>TR GÜCÜ</b> · 5 dk bench · kollektiv</span>
  <span class="right">
    <span>SÜRE <b id="tSüre">5:00</b></span>
    <span>SPENDE <b id="tSpende">—</b></span>
    <span>WERT <b id="tWert">0</b></span>
  </span>
</div>

<div id="main">

  <!-- LINKS: Bench -->
  <div class="col">
    <h2><span>◈ BENCH</span><b id="bState">bereit</b></h2>
    <div class="body">
      <div class="zeitwahl">
        <button data-s="10">10 sek</button>
        <button data-s="60">1 min</button>
        <button data-s="300" class="on">5 min</button>
      </div>

      <div class="zahlen">
        <div class="z cpu">
          <div class="k">CPU</div>
          <div class="v" id="vCpu">0</div>
        </div>
        <div class="z gpu">
          <div class="k">GPU</div>
          <div class="v" id="vGpu">0</div>
        </div>
        <div class="z ram">
          <div class="k">RAM</div>
          <div class="v" id="vRam">0</div>
        </div>
      </div>

      <div class="bar"><i id="bCpu" style="width:0%;background:#ff8a2a"></i></div>
      <div class="bar"><i id="bGpu" style="width:0%;background:#ff3ea5"></i></div>
      <div class="bar"><i id="bRam" style="width:0%;background:#39ff88"></i></div>

      <button class="start" id="btnStart">▶ BENCH STARTEN</button>

      <div id="log"></div>
    </div>
  </div>

  <!-- RECHTS: Visual -->
  <div class="col">
    <h2><span>◈ KOLLEKTIV</span><b id="cState">wach</b></h2>
    <div class="body" style="padding:0;position:relative">
      <canvas id="c"></canvas>
    </div>
  </div>

</div>

<div id="bottom">
  <span>◈ TR GÜCÜ · freiwillig · 5 minuten deiner zeit</span>
  <span><b>für forschung, nicht für krieg</b></span>
  <span style="margin-left:auto">© iki1uc</span>
</div>

<script>
"use strict";

const S = {
  süre: 300,
  läuft: false,
  start: 0,
  cpu: 0, gpu: 0, ram: 0,
  spende: 0,
  log: []
};

/* ─── LOG ─────────────────────────────────────────── */
const logEl = document.getElementById("log");
function log(msg, cls="") {
  const t = new Date().toLocaleTimeString("de-DE");
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = `[${t}] ${msg}`;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
  S.log.push({ t, msg, cls });
}

/* ─── ZEITWAHL ────────────────────────────────────── */
document.querySelectorAll(".zeitwahl button").forEach(b => {
  b.addEventListener("click", () => {
    if (S.läuft) return;
    document.querySelectorAll(".zeitwahl button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    S.süre = parseInt(b.dataset.s, 10);
    updateClock();
    log(`süre: ${S.süre} sek`, "warn");
  });
});

function updateClock() {
  if (S.läuft) {
    const rest = Math.max(0, S.süre - (Date.now() - S.start) / 1000);
    const m = Math.floor(rest / 60);
    const s = Math.floor(rest % 60);
    document.getElementById("tSüre").textContent =
      `${m}:${String(s).padStart(2,"0")}`;
  } else {
    const m = Math.floor(S.süre / 60);
    const s = S.süre % 60;
    document.getElementById("tSüre").textContent =
      `${m}:${String(s).padStart(2,"0")}`;
  }
}

/* ─── BENCH ───────────────────────────────────────── */
async function start() {
  if (S.läuft) return;
  S.läuft = true;
  S.start = Date.now();
  S.cpu = S.gpu = S.ram = 0;

  document.getElementById("btnStart").disabled = true;
  document.getElementById("btnStart").textContent = "◉ LÄUFT…";
  document.getElementById("bState").textContent = "arbeitet";
  log(`◈ bench gestartet · ${S.süre} sekunden`, "ok");
  log(`◈ deine zeit wird gemessen · freiwillig`, "warn");

  // Drei parallele Messungen
  const cpuTask = benchCPU();
  const gpuTask = benchGPU();
  const ramTask = benchRAM();

  const end = S.start + S.süre * 1000;

  // Loop
  const interval = setInterval(() => {
    updateClock();
    const rest = end - Date.now();
    if (rest <= 0) {
      clearInterval(interval);
      stop();
    }
  }, 250);

  // Warten auf Ende
  setTimeout(() => {
    clearInterval(interval);
  }, S.süre * 1000);

  await Promise.all([cpuTask, gpuTask, ramTask]);
}

function stop() {
  if (!S.läuft) return;
  S.läuft = false;
  const gesamtwert = S.cpu + S.gpu + S.ram;
  S.spende = gesamtwert;
  document.getElementById("tWert").textContent = gesamtwert;
  document.getElementById("tSpende").textContent = gesamtwert + " pkt";
  document.getElementById("bState").textContent = "fertig";
  document.getElementById("btnStart").disabled = false;
  document.getElementById("btnStart").textContent = "▶ NOCHMAL · 5 MIN";

  log(`◈ bench fertig`, "ok");
  log(`  CPU: ${S.cpu}  GPU: ${S.gpu}  RAM: ${S.ram}`, "ok");
  log(`  gesamt: ${gesamtwert} punkte → kollektiv`, "warn");
  log(`  danke. das war forschung.`, "ok");
}

/* ─── CPU ─────────────────────────────────────────── */
async function benchCPU() {
  let ops = 0;
  const t0 = Date.now();
  const end = t0 + S.süre * 1000;

  while (Date.now() < end) {
    // Primzahlen
    for (let i = 0; i < 1000; i++) {
      let p = true;
      const n = 100 + i * 100;
      for (let j = 2; j * j <= n; j++) {
        if (n % j === 0) { p = false; break; }
      }
      if (p) ops++;
    }
    // CPU-Score steigt
    S.cpu = Math.min(999, Math.floor(ops / 100));
    document.getElementById("vCpu").textContent = S.cpu;
    document.getElementById("bCpu").style.width = (S.cpu / 10) + "%";
    await sleep(20);
  }
  return ops;
}

/* ─── GPU ─────────────────────────────────────────── */
async function benchGPU() {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 256;
  const g = c.getContext("2d");
  let frames = 0;
  const t0 = Date.now();
  const end = t0 + S.süre * 1000;

  while (Date.now() < end) {
    for (let i = 0; i < 200; i++) {
      g.fillStyle = `hsl(${(frames * 3) % 360},80%,50%)`;
      g.fillRect((i * 3) % 256, (i * 7) % 256, 8, 8);
    }
    frames++;
    S.gpu = Math.min(999, frames);
    document.getElementById("vGpu").textContent = S.gpu;
    document.getElementById("bGpu").style.width = (S.gpu / 10) + "%";
    await sleep(16);
  }
  return frames;
}

/* ─── RAM ─────────────────────────────────────────── */
async function benchRAM() {
  const arr = [];
  let writes = 0;
  const t0 = Date.now();
  const end = t0 + S.süre * 1000;

  while (Date.now() < end) {
    for (let i = 0; i < 500; i++) {
      arr.push({ n: writes, t: Date.now() });
      writes++;
    }
    if (arr.length > 100000) arr.splice(0, 50000);
    S.ram = Math.min(999, Math.floor(writes / 500));
    document.getElementById("vRam").textContent = S.ram;
    document.getElementById("bRam").style.width = (S.ram / 10) + "%";
    await sleep(30);
  }
  return writes;
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ─── BUTTON ──────────────────────────────────────── */
document.getElementById("btnStart").addEventListener("click", () => {
  // Reset
  S.cpu = S.gpu = S.ram = 0;
  document.getElementById("vCpu").textContent = "0";
  document.getElementById("vGpu").textContent = "0";
  document.getElementById("vRam").textContent = "0";
  document.getElementById("bCpu").style.width = "0%";
  document.getElementById("bGpu").style.width = "0%";
  document.getElementById("bRam").style.width = "0%";
  start();
});

/* ─── CANVAS (Kollektiv-Visual) ──────────────────── */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W, H, cx, cy;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = cv.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener("resize", resize);

let t = 0;
const nodes = Array.from({ length: 128 }, (_, i) => ({
  i, phase: Math.random() * Math.PI * 2,
  x: cx, y: cy, active: false
}));

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.fillRect(0, 0, W, H);

  t += 0.02;
  const R = Math.min(W, H) * 0.4;

  // Ringe zeigen den Wert
  const wert = (S.cpu + S.gpu + S.ram) / 3000;

  // 3 Ringe
  [[0.4, "#ff8a2a", S.cpu], [0.7, "#ff3ea5", S.gpu], [1.0, "#39ff88", S.ram]]
    .forEach(([rr, col, val]) => {
      const r = R * rr;
      ctx.strokeStyle = col + "33";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();

      // Fortschritt
      if (val > 0) {
        const a = (val / 1000) * Math.PI * 2;
        ctx.strokeStyle = col;
        ctx.lineWidth = 3;
        ctx.shadowColor = col;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + a);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    });

  // 128 Punkte im Kreis (Kollektiv)
  nodes.forEach((n, i) => {
    const a = (i / 128) * Math.PI * 2 + t * 0.05;
    const r = R * (0.85 + Math.sin(t + n.phase) * 0.05);
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;

    const glow = S.läuft ?
      0.4 + Math.sin(t * 3 + n.phase) * 0.4 :
      0.2;
    const col = S.läuft ? "#39ff88" : "#5a7288";

    ctx.fillStyle = col;
    ctx.globalAlpha = glow;
    ctx.beginPath();
    ctx.arc(x, y, 2 + (S.läuft ? 1 : 0), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Zentrum: ◉
  const pulse = 0.5 + Math.sin(t * 2) * 0.5;
  ctx.fillStyle = `rgba(240,208,128,${0.4 + pulse * 0.5})`;
  ctx.shadowColor = "#f0d080";
  ctx.shadowBlur = 20 * pulse;
  ctx.beginPath();
  ctx.arc(cx, cy, 10 + pulse * 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Text
  ctx.font = "10px Consolas";
  ctx.fillStyle = "#5a7288";
  ctx.textAlign = "center";
  ctx.fillText(S.läuft ? "◉ ARBEITET" : "◉ BEREIT", cx, cy + 40);
  ctx.fillText(`${Math.floor(S.cpu + S.gpu + S.ram)} / 3000`, cx, cy + 56);

  requestAnimationFrame(draw);
}
draw();

/* ─── INIT ────────────────────────────────────────── */
updateClock();
log("◈ TR GÜCÜ geladen", "ok");
log("▸ wähle süre · starte bench · deine zeit für forschung", "warn");
log("▸ 5 minuten · freiwillig · nichts wird gespeichert außer die summe", "warn");
</script>
</body>
</html>
